name: Deploy versioned documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Documentation checks]
    types: [completed]
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.revisions.outputs.main }}
      develop: ${{ steps.revisions.outputs.develop }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze both source revisions
        id: revisions
        run: |
          git fetch origin main develop --tags
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "develop=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"
          git checkout --detach origin/main
          git worktree add "$RUNNER_TEMP/develop-source" origin/develop
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r documentation/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build main
        run: bash documentation/scripts/build-version.sh main "$RUNNER_TEMP/published"
      - name: Build develop
        working-directory: ${{ runner.temp }}/develop-source
        run: |
          pip install -r documentation/requirements.txt
          bash documentation/scripts/build-version.sh develop "$RUNNER_TEMP/develop-site"
      - name: Assemble channels
        run: |
          mv "$RUNNER_TEMP/develop-site" "$RUNNER_TEMP/published/develop"
          python documentation/scripts/check-versioned-site.py "$RUNNER_TEMP/published"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify channel switching in a browser
        working-directory: documentation/visual-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8316 --bind 127.0.0.1 --directory "$RUNNER_TEMP/published" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test --config versioning.config.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/published
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ needs.build.outputs.main }}
          DEVELOP_SHA: ${{ needs.build.outputs.develop }}
        run: |
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$MAIN_SHA"
          test "$(gh api "repos/$REPOSITORY/commits/develop" --jq .sha)" = "$DEVELOP_SHA"
      - uses: actions/deploy-pages@v4
        id: deployment
