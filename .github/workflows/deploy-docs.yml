name: Deploy documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.revisions.outputs.main }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze main source revision
        id: revisions
        run: |
          git fetch origin main --tags
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git checkout --detach origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r documentation/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build main
        run: bash documentation/scripts/build-version.sh main "$RUNNER_TEMP/published"
      - name: Verify publication contents
        run: python documentation/scripts/check-published-site.py "$RUNNER_TEMP/published"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published site in a browser
        working-directory: documentation/visual-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8316 --bind 127.0.0.1 --directory "$RUNNER_TEMP/published" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test --config publication.config.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/published
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ needs.build.outputs.main }}
        run: |
          test "$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" = "$MAIN_SHA"
      - uses: actions/deploy-pages@v4
        id: deployment
