# Wealth and income inequality with the 2026 population age structure.
# Initialise in 2021 (the year available in the local database);
# compare outcomes in 2025-2070.
# Generate input/alignment_files/align_popProjections_no_ageing_2026.xlsx with
# input/alignment_files/DoFilesTarget/04_no_ageing_population_targets.do before running.
# Run with: -config wealth_inequality_no_ageing_2070.yml

maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 606
startYear: 2021
endYear: 2070
popSize: 50000

parameter_args:
  populationProjectionFilename: align_popProjections_no_ageing_2026.xlsx
  EUROMODpolicyScheduleFilename: EUROMODpolicySchedule_wealth_scenarios

model_args:
  bequestSyntheticRecipientCount: 2
  alignPopulation: true
  alignCohabitation: true
  alignFertility: true
  FERTILITY_ALIGNMENT_END_YEAR: 2070
  PARTNERSHIP_ALIGNMENT_END_YEAR: 2070
